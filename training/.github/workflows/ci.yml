name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint & Type Check

    steps:
      - name: Checkout repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Set up Python
        run: |
          python3 --version
          python3 -m pip --version

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check src/ tests/ --output-format=github

      - name: Type check with mypy
        run: |
          mypy src/ tests/

      - name: Format check (black)
        run: |
          black --check src/ tests/

  test:
    runs-on: ubuntu-latest
    name: Unit Tests
    needs: lint

    steps:
      - name: Checkout repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Set up Python
        run: |
          python3 --version
          python3 -m pip --version

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[dev]"

      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short --cov=src/smainer_training --cov-report=term-missing

      - name: Coverage upload disabled
        run: echo "Coverage upload is disabled until a public CI coverage token is configured."

  check-imports:
    runs-on: ubuntu-latest
    name: Forbidden Imports (HC-1)
    # This job runs independently; let lint/test run in parallel

    steps:
      - name: Checkout repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Check for smainer_backend imports (HC-1)
        run: |
          # Scan for direct imports of smainer-backend (forbidden)
          if grep -r "import smainer_backend\|from smainer_backend" src/ tests/ 2>/dev/null; then
            echo " ERROR: Direct imports of smainer_backend detected!"
            echo "   Use subprocess/IPC instead to keep AGPL isolation boundary."
            exit 1
          else
            echo " Forbidden import check passed (no smainer_backend imports)"
          fi

  license-scan:
    runs-on: ubuntu-latest
    name: License Scan (HC-10)

    steps:
      - name: Checkout repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Set up Python
        run: |
          python3 --version
          python3 -m pip --version

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[dev]"

      - name: Scan with pip-licenses (HC-10)
        run: |
          pip install pip-licenses

          echo "Scanning for AGPL packages..."
          AGPL_FOUND=0
          
          # Run pip-licenses and check for AGPL
          if pip-licenses --format=json | grep -i "agpl"; then
            echo " ERROR: AGPL package(s) detected in environment!"
            echo "   AGPL engines MUST run in subprocess isolation, not in smainer-backend."
            AGPL_FOUND=1
          fi

          if [ $AGPL_FOUND -eq 1 ]; then
            exit 1
          else
            echo " License scan passed (no AGPL packages)"
          fi
