name: Docker Publish (HC-5)

# Build and publish smainer-training Docker image
# HC-5: Rejects 'latest' tag; only semantic version tags (vX.Y.Z) allowed

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/smainer-training

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build & Publish Docker Image

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Extract metadata
        id: meta
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          SHORT_SHA="${GITHUB_SHA::12}"
          if [[ "${GITHUB_REF}" == refs/tags/v*.*.* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            MAJOR_MINOR="${VERSION%.*}"
            TAGS="$IMAGE:$VERSION,$IMAGE:$MAJOR_MINOR,$IMAGE:${GITHUB_REF_NAME}-${SHORT_SHA}"
          else
            SAFE_REF="${GITHUB_REF_NAME//\//-}"
            TAGS="$IMAGE:${SAFE_REF}-${SHORT_SHA}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "labels=org.opencontainers.image.revision=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: "Validate tag (HC-5: reject 'latest')"
        id: validate-tag
        run: |
          echo "Validating tags for HC-5 constraint..."
          echo "Tags: ${{ steps.meta.outputs.tags }}"
          
          # Check if 'latest' is in the tags
          TAGS="${{ steps.meta.outputs.tags }}"
          if echo "$TAGS" | grep -q "latest"; then
            echo " FAIL: 'latest' tag is forbidden by HC-5"
            echo "Reason: Prevents accidental production rollbacks"
            echo "Solution: Use explicit semantic version tags (vX.Y.Z)"
            exit 1
          fi
          
          # For semver tags, ensure they match vX.Y.Z
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo " FAIL: Tag '$TAG' does not match semver format vX.Y.Z"
              exit 1
            fi
            echo " Tag '$TAG' matches semver format"
          fi
          
          echo " HC-5 validation passed"

      - name: Build and push
        run: |
          IFS=',' read -ra TAGS <<< "${{ steps.meta.outputs.tags }}"
          BUILD_ARGS=()
          for tag in "${TAGS[@]}"; do
            BUILD_ARGS+=("-t" "$tag")
          done
          docker build "${BUILD_ARGS[@]}" --label "${{ steps.meta.outputs.labels }}" -f ./Dockerfile .
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            for tag in "${TAGS[@]}"; do
              docker push "$tag"
            done
          fi

  verify-no-latest:
    runs-on: ubuntu-latest
    name: Verify No Latest Tag
    needs: build
    if: github.ref_type == 'tag'

    steps:
      - name: Check published tags
        run: |
          echo "Verifying pushed image does not have 'latest' tag..."
          
          # Query the registry for the image
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          
          echo "Image: $IMAGE_REF:$TAG_NAME"
          echo " Semver tag deployment successful"
          echo "  (No 'latest' tag present)"
