name: Docker Publish (HC-5)

# Build and publish smainer-training Docker image
# HC-5: Rejects 'latest' tag; only semantic version tags (vX.Y.Z) allowed

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/smainer-training

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build & Publish Docker Image

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
          flavor: |
            latest=false

      - name: "Validate tag (HC-5: reject 'latest')"
        id: validate-tag
        run: |
          echo "Validating tags for HC-5 constraint..."
          echo "Tags: ${{ steps.meta.outputs.tags }}"
          
          # Check if 'latest' is in the tags
          TAGS="${{ steps.meta.outputs.tags }}"
          if echo "$TAGS" | grep -q "latest"; then
            echo " FAIL: 'latest' tag is forbidden by HC-5"
            echo "Reason: Prevents accidental production rollbacks"
            echo "Solution: Use explicit semantic version tags (vX.Y.Z)"
            exit 1
          fi
          
          # For semver tags, ensure they match vX.Y.Z
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo " FAIL: Tag '$TAG' does not match semver format vX.Y.Z"
              exit 1
            fi
            echo " Tag '$TAG' matches semver format"
          fi
          
          echo " HC-5 validation passed"

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify-no-latest:
    runs-on: ubuntu-latest
    name: Verify No Latest Tag
    needs: build
    if: github.ref_type == 'tag'

    steps:
      - name: Check published tags
        run: |
          echo "Verifying pushed image does not have 'latest' tag..."
          
          # Query the registry for the image
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          
          echo "Image: $IMAGE_REF:$TAG_NAME"
          echo " Semver tag deployment successful"
          echo "  (No 'latest' tag present)"
